<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Berkay Taskin — Product & UX Designer. Portfolio, beliefs, and selected work.">
  <title>Berkay Taskin — Product & UX Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a href="#intro" class="skip-link">Skip to content</a>

  <main>
    <section id="intro" class="section hero" aria-labelledby="hero-title">
      <div class="container">
        <figure class="hero__photo-wrap">
          <img class="hero__photo" src="assets/bt_profile.png" alt="Portrait of Berkay Taskin" width="88" height="88" data-hero-photo>
        </figure>
        <p class="text-meta hero__eyebrow" data-hero-eyebrow></p>
        <h1 id="hero-title" class="text-h1 hero__title" data-hero-title></h1>
        <p class="hero__subhead" data-hero-subhead></p>
        <p class="text-body hero__body" data-hero-body></p>
        <div class="hero__cta">
          <a href="#work" class="btn btn--primary" data-hero-cta>See my work</a>
        </div>
      </div>
    </section>

    <section id="beliefs" class="section section--alt" aria-labelledby="beliefs-title">
      <div class="container">
        <header class="section__header">
          <h2 id="beliefs-title" class="text-h2 section__title" data-beliefs-title></h2>
          <p class="text-body text-secondary section__intro" data-beliefs-intro></p>
        </header>
        <div class="beliefs-grid" data-beliefs-grid></div>
      </div>
    </section>

    <section id="work" class="section" aria-labelledby="work-title">
      <div class="container">
        <header class="section__header">
          <h2 id="work-title" class="text-h2 section__title" data-work-title></h2>
          <p class="text-body text-secondary section__intro" data-work-intro></p>
        </header>
        <div class="work-grid" data-work-grid></div>
      </div>
    </section>

    <section id="references" class="section section--alt" aria-labelledby="references-title">
      <div class="container">
        <header class="section__header">
          <h2 id="references-title" class="text-h2 section__title" data-references-title></h2>
          <p class="text-body text-secondary section__intro" data-references-intro></p>
        </header>
        <div class="refs" data-references-root></div>
      </div>
    </section>

    <section id="services" class="section" aria-labelledby="services-title" hidden>
      <div class="container">
        <header class="section__header">
          <h2 id="services-title" class="text-h2 section__title" data-services-title></h2>
          <p class="text-body text-secondary section__intro" data-services-intro></p>
        </header>
      </div>
    </section>

    <section id="about" class="section" aria-labelledby="about-title">
      <div class="container">
        <h2 id="about-title" class="text-h2 section__title about__title" data-about-title></h2>
        <div class="about__layout">
          <div class="about__prose" data-about-paragraphs></div>
          <div class="about__stack" data-about-stack aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section id="thoughts" class="section section--alt" aria-labelledby="writing-title">
      <div class="container">
        <header class="section__header">
          <h2 id="writing-title" class="text-h2 section__title" data-writing-title></h2>
          <p class="text-body text-secondary section__intro" data-writing-intro></p>
        </header>
        <ul class="writing-list" data-writing-list></ul>
        <div class="writing-more" data-writing-more hidden>
          <button type="button" class="btn btn--secondary" data-writing-more-btn></button>
        </div>
      </div>
    </section>
  </main>

  <footer id="contact" class="site-footer" role="contentinfo">
    <div class="container">
      <div class="site-footer__intro">
        <p class="text-meta site-footer__role" data-footer-role></p>
        <p class="site-footer__name" data-footer-title></p>
      </div>
      <p class="text-meta site-footer__contact-label" data-footer-contact-label></p>
      <nav class="site-footer__links" aria-label="Footer links" data-footer-links></nav>
    </div>
  </footer>

  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
